name: Backend Security CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Add a PostgreSQL service container so the spring datasource check succeeds
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dispatchiq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Grant execute permission for Maven Wrapper
      run: chmod +x ./mvnw

    - name: Run Targeted Security Tests
      run: ./mvnw -pl apps/backend clean test -Dtest=SecurityAuthTest -Dspring.profiles.active=test