name: Backend Security Validation Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/src/main/java/**'
      - 'apps/backend/src/test/java/**'
      - 'apps/backend/pom.xml'
      - '.github/workflows/ci-backend-auth.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/src/main/java/**'
      - 'apps/backend/src/test/java/**'
      - 'apps/backend/pom.xml'
      - '.github/workflows/ci-backend-auth.yaml'

permissions:
  contents: read

jobs:
  security-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: my_security_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: apps/backend/pom.xml

      # Explicitly pointing to the subfolder ensures chmod won't fail
      - name: Make Maven Wrapper Executable
        run: chmod +x ./apps/backend/mvnw

      - name: Execute Security Infrastructure Tests
        working-directory: apps/backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/my_security_test_db
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_password
        run: |
          ./mvnw clean test -Dtest=SecurityAuthTest