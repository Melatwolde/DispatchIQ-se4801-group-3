name: Backend Security CI

on:
  push:
    branches: [ main, develop, E2E ]
  pull_request:
    branches: [ main, develop, E2E ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dispatchiq
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # Quiet the Node runtime notices by ensuring updated structural definitions
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 21
      uses: actions/setup-java@v4.4.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Grant execute permission for Maven Wrapper
      run: chmod +x ./mvnw

    - name: Run Targeted Security Tests
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      run: ./mvnw -pl apps/backend clean test -Dtest=SecurityAuthTest -Dspring.profiles.active=test