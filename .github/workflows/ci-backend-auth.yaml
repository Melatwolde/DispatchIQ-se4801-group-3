name: Backend Security Validation Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/src/main/java/**'
      - 'apps/backend/src/test/java/**'
      - 'apps/backend/pom.xml'
      - '.github/workflows/ci-backend-auth.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/backend/src/main/java/**'
      - 'apps/backend/src/test/java/**'
      - 'apps/backend/pom.xml'
      - '.github/workflows/ci-backend-auth.yaml'

permissions:
  contents: read

jobs:
  security-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: apps/backend/pom.xml

      # Corrected: Targets the single wrapper utility located at your workspace root
      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      # Executes the root wrapper script while focusing compilation strictly on the child module
      - name: Execute Security Infrastructure Tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          ./mvnw -pl apps/backend test -Dtest=SecurityAuthTest