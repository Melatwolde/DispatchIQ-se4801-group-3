
# Load environment variables from a .env file (optional)
spring.config.import=optional:dotenv:

# JWT configuration (provide a dev fallback; replace in production via env)
# NOTE: the fallback value is insecure and intended for local development only
jwt.secret=${JWT_SECRET:change-me-dev-secret-base64}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Datasource defaults (use environment variables set by docker-compose/.env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dispatchiq}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Flyway migration configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
