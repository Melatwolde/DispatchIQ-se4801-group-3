spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXNhZmUtYW5kLXNlY3VyZS0zMi1ieXRlLXNlY3JldC1rZXk=}
  expiration: 86400000
  refresh-expiration: 604800000
  